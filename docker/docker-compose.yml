services:
  recognition-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: the-way-recognition
    ports:
      - "8000:8000"
    volumes:
      - ../data/gt/png:/app/data/gt/png:ro
      - ../data/json:/app/data/json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REFERENCE_IMAGE_DIR=/app/data/gt/png
      - CARD_METADATA_DIR=/app/data/json
      - MAX_IMAGE_DIM=900
      - OPENCV_THREADS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
