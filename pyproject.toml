[project]
name = "the-way-recognition-service"
version = "0.2.0"
description = "CPU-only SIFT recognition microservice for The Way card game scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
    "pydantic-settings>=2.11.0",
    "numpy>=2.3.4",
    "opencv-python-headless>=4.12.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
    "pymupdf>=1.26.0",
]
notebooks = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]
